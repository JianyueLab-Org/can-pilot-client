# 推到默认分支就编译、自动进一位补丁号、发 Release。流程照搬 can-audio 的 release.yml。
#
# 版本号规则：**只有 v3.0.xxx 的 xxx 会自动动。** 主版本和次版本（3.0）是人的
# 决定，写在 Directory.Build.props 的默认 Version 里；补丁号由这个工作流数已有的
# v3.0.* 标签得出，取最大的那个加一。一个都没有就从 v3.0.0 开始。想发 3.1 就去改
# Directory.Build.props 并把下面的 SERIES 一起改——两边对不上时 version job 会直接报错。
#
# 为什么不让 Directory.Build.props 自己维护补丁号：那需要每次发版都回推一个提交改
# 文件，而那个提交又会触发这个工作流，自己咬自己。数标签没有这个问题——标签就是
# 已发布版本的唯一事实来源。v0.0.x 那几个老标签不在本系列里，不参与计数。
#
# 发三个平台：Windows x64（MSFS + X-Plane；SimConnect、opus、RNNoise 是 x64 原生库，只能在 Windows 上打）、
# macOS 通用包（一个 CAN Pilot.app 同时支持 Apple Silicon 和 Intel，要在 macOS 上做 ad-hoc 签名）、
# Linux x64（Arch 的 pacman 包 + 其他发行版通用的 tar.gz）。macOS / Linux 只接 X-Plane。
# PR 也跑全部测试、打包和启动冒烟测试，只是不发版。
#
# X-Plane 原生插件包 native/XPC_for_CAN-plugin.zip 直接放在仓库里：它来自私有仓库
# can-xplane-client 的固定发布包，CI 的 GITHUB_TOKEN 读不到别的私有仓库。换插件版本时
# 在本地用 tools/package-xplane-plugin.py 重新打包再提交。

name: 编译与发布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 打标签、建 Release 都要写权限

# 两次推送挨得很近时会同时算出同一个补丁号，然后第二个打标签失败。
# 串行化，后面那个会重新数一遍。
# PR 各自一组，新提交取消旧的那次。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERIES: "3.0"          # 自动递增只在这个系列里进行；要和 Directory.Build.props 的默认 Version 同系列
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}   # 3.0.7
      tag: ${{ steps.next.outputs.tag }}         # v3.0.7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 要看到全部标签
      - name: 核对 SERIES 和 Directory.Build.props
        shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n "s/.*<Version Condition=\"'\$(CAN_VERSION)' == ''\">\([0-9]*\.[0-9]*\)\.[0-9]*<\/Version>.*/\1/p" Directory.Build.props)
          if [ "$declared" != "$SERIES" ]; then
            echo "::error::Directory.Build.props 的默认版本是 ${declared:-（读不出）}.x，工作流的 SERIES 是 ${SERIES}，两边要一起改"
            exit 1
          fi
      - id: next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          # 只看本系列的标签，取补丁号最大的那个。一个都没有就从 0 开始。
          latest=$(git tag -l "v${SERIES}.*" \
                   | sed -n "s/^v${SERIES}\.\([0-9][0-9]*\)$/\1/p" \
                   | sort -n | tail -1)
          next=$(( ${latest:--1} + 1 ))
          echo "number=${SERIES}.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${SERIES}.${next}"   >> "$GITHUB_OUTPUT"
          echo "上一个补丁号 ${latest:-（无）}，这次发 v${SERIES}.${next}"

  rnnoise:
    # 麦克风降噪的原生库。从 xiph 的 v0.2 发布包构建（SHA-256 固定在脚本里），
    # 不进仓库。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: native/rnnoise/out
          key: rnnoise-0.2-${{ hashFiles('native/rnnoise/CMakeLists.txt', 'native/rnnoise/build.ps1', 'native/rnnoise/compat/os_support.h') }}
      - name: 构建 rnnoise.dll
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/rnnoise/build.ps1 -Out native/rnnoise/out
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-dll
          path: native/rnnoise/out/
          if-no-files-found: error

  rnnoise-unix:
    # macOS / Linux 的 RNNoise：同一个发布包和 CMakeLists，用 build.sh 构建 .so / 通用 .dylib。
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, arch: '' }
          - { os: macos-latest, target: osx-universal, arch: 'arm64;x86_64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: native/rnnoise/out-${{ matrix.target }}
          key: rnnoise-0.2-${{ matrix.target }}-${{ hashFiles('native/rnnoise/CMakeLists.txt', 'native/rnnoise/build.sh', 'native/rnnoise/compat/os_support.h') }}
      - name: 构建 librnnoise
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash native/rnnoise/build.sh "native/rnnoise/out-${{ matrix.target }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rnnoise-${{ matrix.target }}
          path: native/rnnoise/out-${{ matrix.target }}/
          if-no-files-found: error

  test:
    # 和 build 并行。测试没过就不发——release 同时依赖两者。
    # 三个平台都跑：macOS / Linux 走的是 OpenAL、托管 Opus 和各自的 PTT 实现。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 单元测试 + 界面渲染测试
        run: dotnet test CanMfsClient.slnx -c Release

  build:
    needs: [version, rnnoise]
    runs-on: windows-latest
    env:
      OUTPUT: can-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: rnnoise-dll
          path: native/rnnoise/out
      - name: 放 rnnoise.dll
        shell: pwsh
        # CanClient.Core.csproj 只在仓库根目录有这两个文件时才把它们带进输出
        run: |
          Copy-Item native/rnnoise/out/rnnoise.dll .
          Copy-Item native/rnnoise/out/RNNOISE-COPYING .

      - name: 发布 ${{ env.OUTPUT }}
        shell: pwsh
        env:
          # Directory.Build.props 读它；标题栏、日志、更新检查报的都是它
          CAN_VERSION: ${{ needs.version.outputs.number }}
        # 参数和 build.ps1 一致：自包含单文件，原生库打进 EXE，不裁剪
        run: |
          dotnet publish src/CanClient/CanClient.csproj -c Release -r win-x64 --self-contained true -o "dist/$env:OUTPUT" `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE) { throw "发布失败" }

      - name: 验随包文件和版本号
        shell: pwsh
        # 模型库、插件包和许可证是放在 EXE 旁边的随包文件。漏了不会让发布失败，
        # 只会让用户拿到一个装上就缺功能的包，所以在这里显式验一遍。
        run: |
          $root = "dist/$env:OUTPUT"
          $missing = @()
          foreach ($f in @("can-pilot.exe", "ModelMatchingData.bin", "XPC_for_CAN-plugin.zip",
                           "XPLANE-NOTICES.md", "RNNOISE-COPYING")) {
            if (-not (Test-Path "$root/$f")) { $missing += $f }
          }
          if ($missing.Count) { throw "包里缺这些文件: $($missing -join ', ')" }

          $version = ((Get-Item "$root/can-pilot.exe").VersionInfo.ProductVersion -split '\+')[0]
          if ($version -ne "${{ needs.version.outputs.number }}") {
            throw "EXE 里的版本号是 $version，应当是 ${{ needs.version.outputs.number }}"
          }
          Write-Output "随包文件齐全，版本 $version"

      - name: 压包
        working-directory: dist
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:OUTPUT" `
            -DestinationPath "$env:OUTPUT-${{ needs.version.outputs.tag }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: can-pilot-win-x64
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    # Linux x64：只接 X-Plane。自包含单文件 + 随包文件 + 桌面文件，打成 tar.gz，任何 glibc 发行版都能直接解压运行；
    # Arch 另由下面的 arch 任务打成 pacman 包。
    needs: [version, rnnoise-unix]
    runs-on: ubuntu-latest
    env:
      OUTPUT: can-pilot
      RID: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: rnnoise-linux-x64
          path: native/rnnoise/out-linux-x64
      - name: 放 librnnoise
        # CanClient.Core.csproj 只在仓库根目录有这些文件时才把它们带进输出
        run: cp native/rnnoise/out-linux-x64/librnnoise.so native/rnnoise/out-linux-x64/RNNOISE-COPYING .

      - name: 发布 linux-x64
        env:
          CAN_VERSION: ${{ needs.version.outputs.number }}
        run: |
          dotnet publish src/CanClient/CanClient.csproj -c Release -r "$RID" --self-contained true -o "dist/${OUTPUT}" \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: 验随包文件
        run: bash tools/ci-check-package.sh "dist/${OUTPUT}" can-pilot lin.xpl

      - name: 启动冒烟测试
        # 在虚拟 X 显示器里真的把程序跑起来，30 秒内退出就算启动失败；用副本跑，日志和设置不进包
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          smoke="${RUNNER_TEMP}/smoke"
          cp -R "dist/${OUTPUT}" "$smoke"
          set +e
          (cd "$smoke" && xvfb-run -a timeout 30 ./can-pilot)
          code=$?
          set -e
          cat "$smoke"/logs/*.log || true
          if [ "$code" -ne 124 ]; then
            echo "::error::Linux 版启动后 30 秒内就退出了（退出码 ${code}），见上面的日志"
            exit 1
          fi

      - name: 压包
        run: bash tools/package-linux.sh "dist/${OUTPUT}" "dist/${OUTPUT}-${{ needs.version.outputs.tag }}-linux-x64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: can-pilot-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    # macOS 通用包：分别发布 arm64 和 x64，再合进一个 CAN Pilot.app（见 tools/make-macos-app.sh），
    # Apple Silicon 和 Intel 用同一个下载。只接 X-Plane。
    needs: [version, rnnoise-unix]
    runs-on: macos-latest
    env:
      OUTPUT: can-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: rnnoise-osx-universal
          path: native/rnnoise/out-osx-universal
      - name: 放 librnnoise（arm64 + x86_64 通用 dylib）
        run: cp native/rnnoise/out-osx-universal/librnnoise.dylib native/rnnoise/out-osx-universal/RNNOISE-COPYING .

      - name: 发布 osx-arm64 / osx-x64
        env:
          CAN_VERSION: ${{ needs.version.outputs.number }}
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/CanClient/CanClient.csproj -c Release -r "$rid" --self-contained true -o "dist/publish-${rid}" \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          done

      - name: 验随包文件
        run: |
          bash tools/ci-check-package.sh dist/publish-osx-arm64 can-pilot mac.xpl
          bash tools/ci-check-package.sh dist/publish-osx-x64 can-pilot mac.xpl

      - name: 打 CAN Pilot.app
        run: bash tools/make-macos-app.sh "dist/CAN Pilot.app" "${{ needs.version.outputs.number }}" dist/publish-osx-arm64 dist/publish-osx-x64

      - name: 启动冒烟测试（Apple Silicon 原生 + Rosetta 跑 Intel 版）
        # 用副本跑，30 秒内退出就算启动失败；设置和日志写在 ~/Library/Application Support/CAN Pilot Client
        run: |
          app="${RUNNER_TEMP}/CAN Pilot.app"
          cp -R "dist/CAN Pilot.app" "$app"
          logs="${HOME}/Library/Application Support/CAN Pilot Client/logs"
          smoke() {
            local label=$1; shift
            "$@" &
            local pid=$!
            sleep 30
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; wait "$pid" 2>/dev/null || true
              echo "${label}：30 秒后仍在运行"
            else
              set +e; wait "$pid"; local code=$?; set -e
              cat "$logs"/*.log 2>/dev/null || true
              echo "::error::macOS ${label} 启动后 30 秒内就退出了（退出码 ${code}），见上面的日志"
              exit 1
            fi
          }
          smoke "arm64" "$app/Contents/MacOS/can-pilot"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            smoke "x64（Rosetta）" arch -x86_64 "$app/Contents/MacOS/can-pilot"
          else
            echo "::warning::这台 runner 没有 Rosetta，跳过 Intel 版启动测试"
          fi
          cat "$logs"/*.log 2>/dev/null || true

      - name: 压包
        run: (cd dist && ditto -c -k --keepParent "CAN Pilot.app" "${OUTPUT}-${{ needs.version.outputs.tag }}-osx-universal.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: can-pilot-osx-universal
          path: dist/*.zip
          if-no-files-found: error

  arch:
    # Arch Linux 的 pacman 包：用上面的 linux-x64 tar.gz 和 packaging/arch/PKGBUILD 跑 makepkg。
    # 填好版本和校验和的 PKGBUILD 一起发出去，可以直接拿去发 AUR。
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: can-pilot-linux-x64
          path: tarball
      - name: makepkg
        env:
          VERSION: ${{ needs.version.outputs.number }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work" out
          tarball="tarball/can-pilot-${TAG}-linux-x64.tar.gz"
          # makepkg 在 PKGBUILD 旁边找到同名源文件就不下载
          cp "$tarball" "$work/can-pilot-v${VERSION}-linux-x64.tar.gz"
          sum=$(sha256sum "$tarball" | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^sha256sums=.*/sha256sums=('${sum}')/" \
            packaging/arch/PKGBUILD > "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd '$work' && makepkg --nodeps --noconfirm"
          cp "$work"/*.pkg.tar.zst "$work/PKGBUILD" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: can-pilot-arch
          path: out/*
          if-no-files-found: error

  release:
    # 只有推到默认分支才发。手动触发和别的分支只出产物挂在 Actions 里，方便试包而不占版本号。
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [version, test, build, build-linux, build-macos, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: can-pilot-*
          path: packages
          merge-multiple: true

      - name: 生成发布包 SHA-256 清单
        shell: bash
        run: |
          set -euo pipefail
          : > packages/SHA256SUMS
          while IFS= read -r -d '' file; do
            sha256sum "$file" \
              | awk -v name="${file#packages/}" '{print $1 "  " name}' \
              >> packages/SHA256SUMS
          done < <(find packages -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.pkg.tar.zst' \) -print0 | sort -z)
          test -s packages/SHA256SUMS

      - name: 打标签
        # 标签是"已发布版本"的唯一事实来源，下一次就靠它算补丁号
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" \
                  -m "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: CAN Pilot Client ${{ needs.version.outputs.tag }}
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.pkg.tar.zst
            packages/PKGBUILD
            packages/SHA256SUMS
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 平台 | 模拟器 |
            |---|---|---|
            | `can-pilot-${{ needs.version.outputs.tag }}-win-x64.zip` | Windows x64 | MSFS 2020 / 2024、X-Plane 11.50+ / 12 |
            | `can-pilot-${{ needs.version.outputs.tag }}-osx-universal.zip` | macOS 12+（Apple Silicon 和 Intel 通用） | X-Plane 11.50+ / 12 |
            | `can-pilot-bin-${{ needs.version.outputs.number }}-1-x86_64.pkg.tar.zst` | Arch Linux（附 `PKGBUILD`） | X-Plane 11.50+ / 12 |
            | `can-pilot-${{ needs.version.outputs.tag }}-linux-x64.tar.gz` | 其他 Linux x64 发行版 | X-Plane 11.50+ / 12 |

            ### Windows

            解压到一个**可写**的目录，运行里面的 `can-pilot.exe`。无需安装 .NET 或 Python。
            分发和升级时请保留整个文件夹：`ModelMatchingData.bin`（MSFS 模型库）、
            `XPC_for_CAN-plugin.zip`（X-Plane 他机插件）和许可证文件都要和 EXE 放在一起。

            ### macOS

            解压得到 `CAN Pilot.app`（Apple Silicon 和 Intel 通用），拖进"应用程序"。包没有经过 Apple 公证，第一次打开前在终端执行一次
            `xattr -dr com.apple.quarantine "/Applications/CAN Pilot.app"`。键盘 / 鼠标侧键 PTT 需要在
            "系统设置 → 隐私与安全性 → 输入监控"里允许 CAN Pilot；麦克风权限在第一次连语音时弹出。
            设置和日志在 `~/Library/Application Support/CAN Pilot Client`。

            ### Linux

            Arch：`sudo pacman -U can-pilot-bin-*.pkg.tar.zst`，从应用菜单或终端 `can-pilot` 启动。
            其他发行版：解压 tar.gz，运行 `can-pilot/can-pilot`；依赖（ICU、fontconfig、X11 库、中文字体）见 README。
            键盘 / 鼠标 PTT 读取 `/dev/input`，需要把用户加入 `input` 组（`sudo usermod -aG input $USER` 后重新登录）。

            ### X-Plane 的他机插件

            一般不用管它——在客户端设置的 X-Plane 页里安装即可。自动安装不成的话，
            把 `XPC_for_CAN-plugin.zip` 解压后的 `XPC_for_CAN` 文件夹手工拷到
            `<X-Plane>/Resources/plugins/`，重启 X-Plane 生效。来源和许可证见 `XPLANE-NOTICES.md`。

            ### 配置与日志

            设置保存在程序目录的 `msfs_settings.json`，旧版配置可以直接沿用；
            日志在 EXE 旁的 `logs/` 文件夹。校验文件完整性请对照 `SHA256SUMS`。
